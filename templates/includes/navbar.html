{% load static i18n %}
<nav class="navbar navbar-expand-lg navbar-light bg-light" aria-label="{% trans 'Main navigation' %}">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      {# logo si présent, sinon texte visible (alt + accessible) #}
      <img src="{% static 'img/logo.svg' %}" alt="{% trans 'IT CENTER logo' %}" height="36"
           onerror="this.style.display='none';" class="d-inline-block align-text-top">
      <span class="ms-2 fs-5 fw-semibold">IT CENTER</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="{% trans 'Toggle navigation' %}">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link{% if request.path == '/' or request.path == '/accueil/' %} active{% endif %}" href="/"{% if request.path == '/' or request.path == '/accueil/' %} aria-current="page"{% endif %}>{% trans "Accueil" %}</a></li>
        <li class="nav-item"><a class="nav-link{% if '/formations/' in request.path %} active{% endif %}" href="/formations/"{% if '/formations/' in request.path %} aria-current="page"{% endif %}>{% trans "Formations" %}</a></li>
        <li class="nav-item"><a class="nav-link{% if '/services/' in request.path %} active{% endif %}" href="/services/"{% if '/services/' in request.path %} aria-current="page"{% endif %}>{% trans "Services" %}</a></li>
        <li class="nav-item"><a class="nav-link{% if '/produits/' in request.path %} active{% endif %}" href="/produits/"{% if '/produits/' in request.path %} aria-current="page"{% endif %}>{% trans "Produits" %}</a></li>
        <li class="nav-item"><a class="nav-link{% if '/realisations/' in request.path %} active{% endif %}" href="/realisations/"{% if '/realisations/' in request.path %} aria-current="page"{% endif %}>{% trans "Réalisations" %}</a></li>
        <li class="nav-item"><a class="nav-link{% if '/contact/' in request.path %} active{% endif %}" href="/contact/"{% if '/contact/' in request.path %} aria-current="page"{% endif %}>{% trans "Contact" %}</a></li>
      </ul>
    </div>
  </div>
</nav>
